name: Publish portfolio

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish.yml'
      - '.gitignore'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'src/app.d.ts'
      - 'src/app.html'
      - 'src/lib/assets/artworks/**'
      - 'src/routes/**'
      - 'static/**'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Replace published portfolio files
        run: |
          rm -rf about.html contact.html 2d-designs 3d-designs assets freelance traditional
          cp -a build/. .
          git rm -r --cached --ignore-unmatch -- .svelte-kit build node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Published files are already up to date."
            exit 0
          fi
          git commit -m "Publish portfolio"
          git push
